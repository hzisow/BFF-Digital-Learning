<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Absolute, not "./". Deep links are served the 404.html fallback from a
         nested path, so a relative icon href resolves against /lessons/ and
         404s. Vite rewrites a leading "/" to the configured base at build
         time, so this stays correct under either base. -->
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BFF Classroom: free interactive financial literacy lessons, games, and activities from BFF of America."
    />
    <!-- Fonts are self-hosted and bundled (see the @fontsource imports at the top
         of src/index.css). No third-party font request is made at runtime. -->
    <title>BFF Classroom · Building Financial Futures of America</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
