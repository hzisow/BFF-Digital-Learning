<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy. GitHub Pages cannot set response headers, so
         this is delivered as a meta tag. It is the compensating control for the
         one dangerouslySetInnerHTML sink (which already escapes model output)
         and for any future injection: script and connections are pinned to this
         origin plus the three services the app genuinely talks to (Supabase,
         Google Sign-In, YouTube embeds). 'unsafe-inline' stays on script/style
         because the bundler emits inline module bootstrap and the UI uses inline
         style attributes, and Pages offers no nonce; the host allowlist is what
         blocks loading code from an attacker's domain. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data:; connect-src 'self' https://xrlmxpmaykldvbjnoapk.supabase.co wss://xrlmxpmaykldvbjnoapk.supabase.co https://accounts.google.com; frame-src https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https://*.googlevideo.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Absolute, not "./". Deep links are served the 404.html fallback from a
         nested path, so a relative icon href resolves against /lessons/ and
         404s. Vite rewrites a leading "/" to the configured base at build
         time, so this stays correct under either base. -->
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BFF Classroom: free interactive financial literacy lessons, games, and activities from BFF of America."
    />
    <!-- Fonts are self-hosted and bundled (see the @fontsource imports at the top
         of src/index.css). No third-party font request is made at runtime. -->
    <title>BFF Classroom · Building Financial Futures of America</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
