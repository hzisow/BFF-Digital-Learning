# Keep the GitHub Actions pinned by SHA (see deploy.yml) current: Dependabot
# opens a PR that bumps both the SHA and the trailing version comment when a new
# release lands, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
